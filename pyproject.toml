[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosim-gpu"
version = "0.1.0"
description = "GPU-first sparse neural simulation with bounded-error persistent synaptic currents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The NeuroSim GPU authors" }]
keywords = [
    "computational-neuroscience",
    "sparse",
    "cuda",
    "pytorch",
    "spiking-neural-network",
    "simulation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.7"]

[project.optional-dependencies]
dev = ["build>=1.2"]

# [project.urls] is intentionally omitted until the public repository exists.
# Add "Homepage", "Documentation", "Issues" and "Changelog" here at that point.

[tool.setuptools.packages.find]
where = ["src"]
